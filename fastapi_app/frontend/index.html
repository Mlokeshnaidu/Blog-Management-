<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Management</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand" onclick="setTab('all')">BlogHub</div>
    <div class="nav-links">
      <button class="nav-btn active" id="tab-all" onclick="setTab('all')">All Posts</button>
      <button class="nav-btn" id="tab-mine" style="display:none" onclick="setTab('mine')">My Posts</button>
      <a href="/docs" target="_blank" class="nav-btn">Swagger Docs</a>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary" id="btn-new-post" style="display:none" onclick="openPostModal()">+ New Post</button>
      <div id="auth-logged-out">
        <button class="btn btn-secondary" onclick="openAuthModal('login')">Sign In</button>
        <button class="btn btn-primary" onclick="openAuthModal('register')">Register</button>
      </div>
      <div id="auth-logged-in" style="display:none" class="user-badge">
        <span id="user-display"></span>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search posts..." oninput="debounceSearch(this.value)">
    </div>
    <div id="posts-list" class="posts-grid"></div>
  </main>

  <!-- Post Modal (Create / Edit) -->
  <div id="post-modal" class="modal">
    <div class="modal-content">
      <h3 id="post-modal-title">Create Post</h3>
      <input type="hidden" id="post-id">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="post-title" required>
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea id="post-content" rows="6" required></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('post-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="savePost()">Save</button>
      </div>
    </div>
  </div>

  <!-- Post Detail & Comments Modal -->
  <div id="detail-modal" class="modal">
    <div class="modal-content detail-content">
      <button class="close-btn" onclick="closeModal('detail-modal')">&times;</button>
      <h2 id="detail-title"></h2>
      <div class="detail-meta">By <span id="detail-author"></span> | <span id="detail-date"></span></div>
      <p id="detail-body" class="detail-text"></p>
      
      <div class="detail-actions">
        <button class="btn btn-secondary" id="detail-like-btn" onclick="toggleDetailLike()">
          Like (<span id="detail-like-count">0</span>)
        </button>
      </div>

      <hr class="divider">
      <h3>Comments</h3>
      <div class="comment-input-box">
        <input type="text" id="comment-text" placeholder="Add a comment...">
        <button class="btn btn-primary btn-sm" onclick="addComment()">Comment</button>
      </div>
      <div id="comments-list" class="comments-list"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content auth-content">
      <div class="tab-toggle">
        <button id="auth-tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
        <button id="auth-tab-register" class="tab-btn" onclick="switchAuthTab('register')">Register</button>
      </div>
      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="auth-username" required>
        </div>
        <div class="form-group" id="group-email" style="display:none">
          <label>Email</label>
          <input type="email" id="auth-email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-password" required>
        </div>
        <button type="submit" id="auth-submit-btn" class="btn btn-primary full-width">Sign In</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
