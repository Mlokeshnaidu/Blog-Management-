<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Support Chat — Blog Management</title>
    <meta name="description" content="AI-powered support assistant for the Blog Management platform. Get instant help with posts, subscriptions, billing, and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ─────────────────────────────────────── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ── Auth Section ─────────────────────────────────────── */
        .auth-section {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .auth-card h2 {
            font-size: 18px;
            font-weight: 600;
            color: #a5b4fc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-row {
            display: flex;
            gap: 12px;
        }

        .auth-row input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .auth-row input::placeholder { color: #64748b; }

        .auth-row input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        .auth-row button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            white-space: nowrap;
        }

        .auth-row button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .auth-status {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            min-height: 20px;
        }

        .auth-status.connected { color: #34d399; }
        .auth-status.error { color: #f87171; }

        /* ── Chat Container ───────────────────────────────────── */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: calc(100vh - 220px);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 20px;
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* ── Chat Header ──────────────────────────────────────── */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.1));
            border-bottom: 1px solid rgba(99, 102, 241, 0.15);
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }

        .chat-header-info h2 {
            font-size: 17px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .chat-header-info p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .chat-header-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Messages Area ────────────────────────────────────── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 3px;
        }

        /* ── Message Bubbles ──────────────────────────────────── */
        .message {
            max-width: 85%;
            animation: messageIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
        }

        .message.ai .message-bubble {
            background: rgba(51, 65, 85, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-bottom-left-radius: 6px;
        }

        .message-time {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
            padding: 0 4px;
        }

        .message.user .message-time { text-align: right; }
        .message.ai .message-time { text-align: left; }

        /* Bold text in AI responses */
        .message-bubble b, .message-bubble strong {
            color: #a5b4fc;
            font-weight: 600;
        }

        /* ── Typing Indicator ─────────────────────────────────── */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 14px 20px;
            background: rgba(51, 65, 85, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: 18px;
            border-bottom-left-radius: 6px;
        }

        .typing-indicator.visible { display: flex; }

        .typing-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #818cf8;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* ── Quick Actions ────────────────────────────────────── */
        .quick-actions {
            padding: 0 24px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-btn {
            padding: 8px 14px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 20px;
            color: #a5b4fc;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .quick-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: #c7d2fe;
            transform: translateY(-1px);
        }

        /* ── Input Area ───────────────────────────────────────── */
        .chat-input-area {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 16px 24px 20px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid rgba(99, 102, 241, 0.1);
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        #chatInput {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 48px;
            line-height: 1.5;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #chatInput::placeholder { color: #64748b; }

        #chatInput:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.12);
        }

        #sendBtn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.3s, opacity 0.2s;
            flex-shrink: 0;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #sendBtn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ── Welcome Message ──────────────────────────────────── */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .welcome-message h3 {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .welcome-message p {
            font-size: 13px;
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto;
        }

        /* ── Responsive ───────────────────────────────────────── */
        @media (max-width: 640px) {
            body { padding: 10px; }

            .chat-container {
                height: calc(100vh - 180px);
                border-radius: 16px;
            }

            .auth-card { padding: 16px; }

            .auth-row {
                flex-direction: column;
            }

            .chat-messages { padding: 16px; }

            .message { max-width: 90%; }

            .quick-actions {
                padding: 0 16px 8px;
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .chat-input-area {
                padding: 12px 16px 16px;
            }
        }

        /* ── Floating Chat Button (for embedding) ─────────────── */
        .chat-fab {
            display: none; /* shown only in embed mode */
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
            z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>

<!-- Auth Section -->
<div class="auth-section">
    <div class="auth-card">
        <h2>Authentication</h2>
        <div class="auth-row">
            <input type="text" id="tokenInput" placeholder="Paste your JWT token here..." />
            <button onclick="connectChat()" id="connectBtn">Connect</button>
        </div>
        <div class="auth-status" id="authStatus"></div>
    </div>
</div>

<!-- Chat Container -->
<div class="chat-container" id="chatContainer">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-avatar">AI</div>
        <div class="chat-header-info">
            <h2>AI Support Assistant</h2>
            <div class="chat-header-status">
                <span class="status-dot"></span>
                <p>Always online • Instant replies</p>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="welcome-message" id="welcomeMsg">
            <span class="welcome-icon">Chat</span>
            <h3>Welcome to AI Support</h3>
            <p>Connect with your JWT token above, then ask me anything about the Blog Management platform — posts, subscriptions, billing, analytics, and more!</p>
        </div>
    </div>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="quick-actions" id="quickActions">
        <button class="quick-btn" onclick="sendQuickMessage('How do I create a post?')">Create Post</button>
        <button class="quick-btn" onclick="sendQuickMessage('How do subscriptions work?')">Subscriptions</button>
        <button class="quick-btn" onclick="sendQuickMessage('Tell me about billing')">Billing</button>
        <button class="quick-btn" onclick="sendQuickMessage('How do I use the dashboard?')">Dashboard</button>
        <button class="quick-btn" onclick="sendQuickMessage('How do I manage my profile?')">Profile</button>
        <button class="quick-btn" onclick="sendQuickMessage('Help')">Help</button>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
        <div class="chat-input-wrapper">
            <textarea
                id="chatInput"
                placeholder="Type your message..."
                rows="1"
                disabled
            ></textarea>
        </div>
        <button id="sendBtn" onclick="sendMessage()" disabled title="Send message">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    // ── State ─────────────────────────────────────────────────
    let jwtToken = '';
    let isConnected = false;
    let isSending = false;

    const messagesEl = document.getElementById('chatMessages');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const authStatus = document.getElementById('authStatus');
    const quickActions = document.getElementById('quickActions');

    // ── Auto-resize textarea ─────────────────────────────────
    inputEl.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // ── Send on Enter (Shift+Enter for newline) ──────────────
    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ── Connect with JWT ─────────────────────────────────────
    async function connectChat() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) {
            setAuthStatus('Please enter your JWT token.', 'error');
            return;
        }

        setAuthStatus('Connecting...', '');

        try {
            // Validate the token by loading chat history
            const res = await fetch('/api/ai-support/history?limit=50', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                setAuthStatus(err.detail || 'Authentication failed (HTTP ' + res.status + ')', 'error');
                return;
            }

            jwtToken = token;
            isConnected = true;

            // Enable input
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();

            setAuthStatus('✓ Connected successfully', 'connected');

            // Load existing chat history
            const data = await res.json();
            if (data.messages && data.messages.length > 0) {
                welcomeMsg.style.display = 'none';
                data.messages.forEach(msg => {
                    appendMessage(msg.question, 'user', new Date(msg.created_at), false);
                    appendMessage(msg.ai_response, 'ai', new Date(msg.created_at), false);
                });
                scrollToBottom();
            }

        } catch (e) {
            setAuthStatus('Connection error: ' + e.message, 'error');
        }
    }

    function setAuthStatus(text, type) {
        authStatus.textContent = text;
        authStatus.className = 'auth-status' + (type ? ' ' + type : '');
    }

    // ── Send Message ─────────────────────────────────────────
    async function sendMessage() {
        if (!isConnected || isSending) return;

        const message = inputEl.value.trim();
        if (!message) return;

        // Clear input
        inputEl.value = '';
        inputEl.style.height = 'auto';

        // Hide welcome message
        welcomeMsg.style.display = 'none';

        // Add user message
        appendMessage(message, 'user');

        // Show typing indicator
        isSending = true;
        sendBtn.disabled = true;
        showTypingIndicator();

        try {
            const res = await fetch('/api/ai-support/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + jwtToken,
                },
                body: JSON.stringify({ message: message }),
            });

            hideTypingIndicator();

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                appendMessage('Sorry, something went wrong: ' + (err.detail || 'Unknown error'), 'ai');
            } else {
                const data = await res.json();
                appendMessage(data.ai_response, 'ai');
            }

        } catch (e) {
            hideTypingIndicator();
            appendMessage('Network error: ' + e.message + '. Please try again.', 'ai');
        } finally {
            isSending = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    // ── Quick Messages ───────────────────────────────────────
    function sendQuickMessage(text) {
        if (!isConnected) {
            setAuthStatus('Please connect with your JWT token first.', 'error');
            return;
        }
        inputEl.value = text;
        sendMessage();
    }

    // ── Append Message to Chat ───────────────────────────────
    function appendMessage(text, type, timestamp, animate = true) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + type;
        if (!animate) msgDiv.style.animation = 'none';

        const time = timestamp || new Date();
        const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Format text: convert **bold** markers for AI responses
        let formattedText = escapeHtml(text);
        if (type === 'ai') {
            formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        }

        msgDiv.innerHTML = `
            <div class="message-bubble">${formattedText}</div>
            <div class="message-time">${timeStr}</div>
        `;

        messagesEl.appendChild(msgDiv);
        scrollToBottom();
    }

    // ── Helpers ───────────────────────────────────────────────
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        });
    }

    function showTypingIndicator() {
        typingIndicator.classList.add('visible');
        scrollToBottom();
    }

    function hideTypingIndicator() {
        typingIndicator.classList.remove('visible');
    }

    // ── Allow Enter on token input ───────────────────────────
    document.getElementById('tokenInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            connectChat();
        }
    });
</script>

</body>
</html>
