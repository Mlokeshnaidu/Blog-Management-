<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard — Blog Management</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* ── Header ────────────────────────────────────────── */
        .header {
            background: #1a73e8;
            color: #fff;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 22px; }
        .header .username { font-size: 14px; opacity: .85; }

        /* ── Auth bar ──────────────────────────────────────── */
        .auth-bar {
            max-width: 900px;
            margin: 24px auto 0;
            display: flex;
            gap: 10px;
        }
        .auth-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .auth-bar button {
            padding: 10px 22px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .auth-bar button:hover { background: #1558b0; }

        /* ── Stats cards ───────────────────────────────────── */
        .stats {
            max-width: 900px;
            margin: 24px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .stat-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,.1);
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #1a73e8;
        }
        .stat-card .label {
            margin-top: 6px;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        /* ── Chart containers ──────────────────────────────── */
        .charts {
            max-width: 900px;
            margin: 0 auto 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-box {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.1);
        }
        .chart-box h3 {
            margin-bottom: 12px;
            font-size: 15px;
            color: #444;
        }

        /* ── Messages ──────────────────────────────────────── */
        .msg {
            max-width: 900px;
            margin: 16px auto;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .msg.error { background: #fdecea; color: #b71c1c; display: block; }
        .msg.info  { background: #e8f0fe; color: #1a73e8; display: block; }

        /* ── Responsive ────────────────────────────────────── */
        @media (max-width: 700px) {
            .charts { grid-template-columns: 1fr; }
            .stats  { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 User Dashboard</h1>
    <span class="username" id="headerUser"></span>
</div>

<!-- Token input -->
<div class="auth-bar">
    <input type="text" id="tokenInput" placeholder="Paste your JWT token here" />
    <button onclick="loadDashboard()">Load Dashboard</button>
</div>

<div class="msg" id="msg"></div>

<!-- Stat cards (hidden until loaded) -->
<div class="stats" id="statsSection" style="display:none;">
    <div class="stat-card">
        <div class="value" id="totalPosts">0</div>
        <div class="label">Total Posts</div>
    </div>
    <div class="stat-card">
        <div class="value" id="totalComments">0</div>
        <div class="label">Total Comments</div>
    </div>
    <div class="stat-card">
        <div class="value" id="totalLikes">0</div>
        <div class="label">Likes Received</div>
    </div>
    <div class="stat-card">
        <div class="value" id="totalViews">0</div>
        <div class="label">Post Views</div>
    </div>
</div>

<!-- Charts (hidden until loaded) -->
<div class="charts" id="chartsSection" style="display:none;">
    <div class="chart-box">
        <h3>Likes & Comments per Post</h3>
        <canvas id="barChart"></canvas>
    </div>
    <div class="chart-box">
        <h3>Post Activity Over Time</h3>
        <canvas id="lineChart"></canvas>
    </div>
</div>

<script>
    let barChartInstance = null;
    let lineChartInstance = null;

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = 'msg ' + type;
    }

    async function loadDashboard() {
        const token = document.getElementById('tokenInput').value.trim();
        if (!token) { showMsg('Please enter your JWT token.', 'error'); return; }

        showMsg('Loading…', 'info');

        try {
            const res = await fetch('/user/dashboard/', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                showMsg(err.detail || 'Failed to load dashboard (HTTP ' + res.status + ')', 'error');
                return;
            }

            const data = await res.json();
            renderDashboard(data);
            document.getElementById('msg').style.display = 'none';
        } catch (e) {
            showMsg('Network error: ' + e.message, 'error');
        }
    }

    function renderDashboard(data) {
        // Header username
        document.getElementById('headerUser').textContent = data.username;

        // Stat cards
        document.getElementById('totalPosts').textContent = data.total_posts;
        document.getElementById('totalComments').textContent = data.total_comments;
        document.getElementById('totalLikes').textContent = data.total_likes_received;
        document.getElementById('totalViews').textContent = data.total_views;
        document.getElementById('statsSection').style.display = 'grid';

        // Show charts section
        document.getElementById('chartsSection').style.display = 'grid';

        // ── Bar Chart: Likes & Comments per post ──────────
        const postLabels = data.posts_stats.map(p => p.title.length > 20 ? p.title.slice(0, 20) + '…' : p.title);
        const likesData  = data.posts_stats.map(p => p.likes_count);
        const commData   = data.posts_stats.map(p => p.comments_count);

        if (barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: postLabels,
                datasets: [
                    {
                        label: 'Likes',
                        data: likesData,
                        backgroundColor: 'rgba(26, 115, 232, 0.7)',
                        borderRadius: 4
                    },
                    {
                        label: 'Comments',
                        data: commData,
                        backgroundColor: 'rgba(52, 168, 83, 0.7)',
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'top' } },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        // ── Line Chart: Post activity over time ───────────
        const timeLabels = data.activity_over_time.map(a => a.date);
        const timeCounts = data.activity_over_time.map(a => a.posts);

        if (lineChartInstance) lineChartInstance.destroy();
        lineChartInstance = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [{
                    label: 'Posts Created',
                    data: timeCounts,
                    borderColor: '#1a73e8',
                    backgroundColor: 'rgba(26, 115, 232, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointBackgroundColor: '#1a73e8'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'top' } },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });
    }
</script>

</body>
</html>
